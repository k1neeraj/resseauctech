name: Refresh dependencies

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    name: Update, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install current lockfile
        run: pnpm install --frozen-lockfile

      - name: Update direct dependencies to current stable releases
        run: pnpm up --latest

      - name: Validate lockfile and installation
        run: pnpm install --frozen-lockfile

      - name: Check dependency advisories
        run: pnpm audit --audit-level=high

      - name: Build production application
        run: pnpm build

      - name: Commit validated manifest and lockfile to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "All direct dependencies are already current."
            exit 0
          fi

          node -e "const p=require('./package.json'); console.log('Validated dependency versions:'); for (const section of ['dependencies','devDependencies']) { console.log(section + ':'); for (const [name, version] of Object.entries(p[section] || {})) console.log('  ' + name + ': ' + version); }"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(deps): update dependencies to latest stable releases"
          git push origin HEAD:main
